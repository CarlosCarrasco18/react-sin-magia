<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Heladería</title>
  </head>
  <body>
    <label for="name-html">Nombre del sabor</label>
    <input id="name-html" maxlength="40" readonly class="field" />

    <div id="root"></div>

    <script src="https://unpkg.com/@babel/standalone@8.0.4/babel.min.js"></script>

    <script type="text/babel" data-type="module">
      import React from "https://esm.sh/react@19.2.0?dev";
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client?dev";

      const field = (
        <>
          <label htmlFor="name-jsx">Nombre del sabor</label>
          <input id="name-jsx" maxLength="40" readOnly className="field" />

          <img src="imagenes/mora.avif" alt="Helado de mora silvestre" className="photo" />
          <label htmlFor="description">Descripción</label>
          <input id="description" maxLength="120" readOnly className="field" />
        </>
      );

      createRoot(document.getElementById("root")).render(field);
    </script>
  </body>
</html>
